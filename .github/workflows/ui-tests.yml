name: UI-тесты SL Flights

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_pages:
        description: Опубликовать отчёт на GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: slflights-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Chrome и Firefox
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      pages_artifact: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Собрать проект и запустить UI-тесты
        run: ./gradlew build firefoxTest -Pbrowser=chrome -Psuite=full --continue --no-daemon
      - name: Сохранить HTML-отчёт и результаты
        if: ${{ !cancelled() && hashFiles('reports/allure/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: slflights-allure
          path: |
            reports/allure/
            reports/allure-results/
      - name: Подготовить HTML для GitHub Pages
        id: pages
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch && inputs.publish_pages && hashFiles('reports/allure/index.html') != '' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports/allure/

  pages:
    name: Опубликовать Allure
    needs: test
    if: ${{ !cancelled() && needs.test.outputs.pages_artifact == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
